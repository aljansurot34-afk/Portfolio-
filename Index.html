        :root {
            --bg: #050816;
            --bg-secondary: #0a1024;
            --card: rgba(15, 23, 42, 0.72);
            --card-solid: #0d152b;
            --primary: #4f7cff;
            --primary-light: #7c9cff;
            --secondary: #6d5dfc;
            --text: #f5f7ff;
            --muted: #9ba7c2;
            --border: rgba(124, 156, 255, 0.16);
            --success: #38d39f;
            --shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
            --radius: 22px;
            --transition: 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at 15% 15%, rgba(79, 124, 255, 0.12), transparent 28%),
                radial-gradient(circle at 85% 25%, rgba(109, 93, 252, 0.12), transparent 28%),
                var(--bg);
            color: var(--text);
            line-height: 1.7;
            overflow-x: hidden;
        }

        body.light-mode {
            --bg: #f4f7ff;
            --bg-secondary: #ffffff;
            --card: rgba(255, 255, 255, 0.82);
            --card-solid: #ffffff;
            --text: #10182d;
            --muted: #5f6b85;
            --border: rgba(55, 82, 145, 0.15);
            --shadow: 0 20px 60px rgba(44, 61, 100, 0.12);
            background:
                radial-gradient(circle at 15% 15%, rgba(79, 124, 255, 0.10), transparent 28%),
                radial-gradient(circle at 85% 25%, rgba(109, 93, 252, 0.10), transparent 28%),
                var(--bg);
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button,
        input,
        textarea {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        ::selection {
            background: var(--primary);
            color: white;
        }

        .container {
            width: min(1120px, 92%);
            margin: auto;
        }

        /* =========================
           BACKGROUND EFFECTS
           ========================= */

        .background-orb {
            position: fixed;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.10;
            pointer-events: none;
            z-index: -1;
        }

        .orb-one {
            background: #426eff;
            top: 10%;
            left: -150px;
        }

        .orb-two {
            background: #785cff;
            right: -150px;
            bottom: 10%;
        }

        /* =========================
           NAVBAR
           ========================= */

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            transition: var(--transition);
        }

        header.scrolled {
            background: rgba(5, 8, 22, 0.82);
            backdrop-filter: blur(18px);
            border-bottom: 1px solid var(--border);
        }

        body.light-mode header.scrolled {
            background: rgba(244, 247, 255, 0.82);
        }

        nav {
            min-height: 78px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 25px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 11px;
            font-weight: 800;
            font-size: 1.15rem;
            letter-spacing: 0.5px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            display: grid;
            place-items: center;
            border-radius: 13px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            box-shadow: 0 10px 30px rgba(79, 124, 255, 0.25);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 25px;
            list-style: none;
        }

        .nav-links a {
            color: var(--muted);
            font-size: 0.92rem;
            font-weight: 600;
            transition: var(--transition);
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--text);
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .theme-btn,
        .menu-btn {
            width: 42px;
            height: 42px;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            border-radius: 12px;
            display: grid;
            place-items: center;
            transition: var(--transition);
        }

        .theme-btn:hover,
        .menu-btn:hover {
            transform: translateY(-2px);
            border-color: var(--primary);
        }

        .menu-btn {
            display: none;
        }

        /* =========================
           GENERAL
           ========================= */

        section {
            padding: 100px 0;
        }

        .section-heading {
            text-align: center;
            max-width: 700px;
            margin: 0 auto 55px;
        }

        .section-label {
            display: inline-block;
            color: var(--primary-light);
            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .section-heading h2 {
            font-size: clamp(2rem, 4vw, 3rem);
            line-height: 1.15;
            margin-bottom: 15px;
        }

        .section-heading p {
            color: var(--muted);
        }

        .gradient-text {
            background: linear-gradient(90deg, #7da1ff, #9a8cff, #54c9ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* =========================
           BUTTONS
           ========================= */

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            border: none;
            border-radius: 13px;
            padding: 13px 20px;
            font-weight: 700;
            transition: var(--transition);
        }

        .btn-primary {
            color: white;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            box-shadow: 0 12px 30px rgba(79, 124, 255, 0.22);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 18px 40px rgba(79, 124, 255, 0.32);
        }

        .btn-outline {
            border: 1px solid var(--border);
            color: var(--text);
            background: rgba(255,255,255,0.02);
        }

        .btn-outline:hover {
            border-color: var(--primary);
            background: rgba(79,124,255,0.08);
            transform: translateY(-3px);
        }

        /* =========================
           HOME
           ========================= */

        #home {
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding-top: 130px;
            position: relative;
        }

        .hero {
            display: grid;
            grid-template-columns: 1.15fr 0.85fr;
            align-items: center;
            gap: 70px;
        }

        .availability {
            display: inline-flex;

        .hero h1 {

        .hero h1 span {

        .hero-description {

            grid-template-columns: repeat(2, 1fr);
            gap: 12px;

            border-radius: 16px;
            text-align: center;

        .stat strong {

            font-size: 1.4rem;

        }

           ABOUT

            grid-template-columns: 0.8fr 1.2fr;

            margin-bottom: 15px;

            padding-bottom: 0;

        .info-row span:first-child {
            color: var(--muted);
        }

        .info-row span:last-child {
            text-align: right;
            font-weight: 700;
        }

           SKILLS
           ========================= */

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;

            border-radius: 18px;
            background: var(--card);
            transition: var(--transition);

            border-color: rgba(124, 156, 255, 0.45);
            box-shadow: var(--shadow);
        }

            place-items: center;

            color: var(--muted);
            font-size: 0.84rem;
        }

        /* =========================
           EXPERIENCE / TIMELINE
           ========================= */

        .timeline {
            position: relative;
            max-width: 850px;
            margin: auto;
        }

        .timeline::before {
            content: "";
            position: absolute;
            left: 22px;
            top: 0;
            bottom: 0;
            width: 1px;
            background: linear-gradient(var(--primary), transparent);
        }

        .timeline-item {
            position: relative;
            padding-left: 65px;
            margin-bottom: 35px;
        }

        .timeline-dot {
            position: absolute;
            left: 12px;
            top: 5px;
            width: 21px;
            height: 21px;
            border-radius: 50%;
            background: var(--bg);
            border: 5px solid var(--primary);
            box-shadow: 0 0 0 5px rgba(79,124,255,0.10);
        }

        .timeline-card {
            padding: 25px;
            border: 1px solid var(--border);
            background: var(--card);
            border-radius: 18px;
            transition: var(--transition);
        }

        .timeline-card:hover {
            transform: translateX(6px);
            border-color: rgba(124,156,255,0.4);
        }

        .timeline-card h3 {
            margin-bottom: 5px;
        }

        .timeline-card p {
            color: var(--muted);
        }

        /* =========================
           PROJECTS
           ========================= */

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 22px;
        }

        .project-card {
            position: relative;
            overflow: hidden;
            min-height: 260px;
            padding: 30px;
            border: 1px solid var(--border);
            background: var(--card);
            border-radius: var(--radius);
            transition: var(--transition);
        }

        .project-card::before {
            content: "";
            position: absolute;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: rgba(79,124,255,0.13);
            filter: blur(35px);
            right: -80px;
            top: -80px;
        }

        .project-card:hover {
            transform: translateY(-8px);
            border-color: rgba(124,156,255,0.45);
            box-shadow: var(--shadow);
        }

        .project-number {
            position: relative;
            display: inline-flex;
            width: 42px;
            height: 42px;
            align-items: center;
            justify-content: center;
            border-radius: 13px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            font-weight: 800;
            margin-bottom: 25px;
        }

        .project-card h3 {
            position: relative;
            font-size: 1.35rem;
            margin-bottom: 10px;
        }

        .project-card p {
            position: relative;
            color: var(--muted);
            font-size: 0.92rem;
            margin-bottom: 20px;
        }

        .tags {
            position: relative;
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
        }

        .tag {
            padding: 5px 10px;
            border-radius: 999px;
            background: rgba(79,124,255,0.09);
            border: 1px solid var(--border);
            color: var(--primary-light);
            font-size: 0.72rem;
        }

        /* =========================
           EDUCATION + CERTIFICATIONS
           ========================= */

        .two-column {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .education-card,
        .certificate-card {
            border: 1px solid var(--border);
            background: var(--card);
            border-radius: var(--radius);
            padding: 30px;
            transition: var(--transition);
        }

        .education-card:hover,
        .certificate-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow);
        }

        .education-icon,
        .certificate-icon {
            width: 55px;
            height: 55px;
            display: grid;
            place-items: center;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            font-size: 1.4rem;
            margin-bottom: 20px;
        }

        .education-card h3,
        .certificate-card h3 {
            margin-bottom: 8px;
        }

        .education-card p,
        .certificate-card p {
            color: var(--muted);
        }

        .certificate-list {
            display: grid;
            gap: 12px;
            margin-top: 20px;
        }

        .certificate-item {
            padding: 13px 15px;
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--muted);
        }

<script>

/* =========================================================
   MOBILE MENU
========================================================= */

const menuBtn = document.getElementById("menuBtn");
const navLinks = document.getElementById("navLinks");


menuBtn.addEventListener("click", function () {

    navLinks.classList.toggle("open");

    if (navLinks.classList.contains("open")) {

        menuBtn.textContent = "✕";

    } else {

        menuBtn.textContent = "☰";

    }

});


/* Close mobile menu after clicking navigation link */

document
    .querySelectorAll(".nav-links a")
    .forEach(function (link) {

        link.addEventListener("click", function () {

            navLinks.classList.remove("open");

            menuBtn.textContent = "☰";

        });

    });


/* =========================================================
   HEADER SCROLL EFFECT
========================================================= */

const header = document.getElementById("header");


window.addEventListener("scroll", function () {

    if (window.scrollY > 30) {

        header.classList.add("scrolled");

    } else {

        header.classList.remove("scrolled");

    }

});


/* =========================================================
   ACTIVE NAVIGATION
========================================================= */

const sections = document.querySelectorAll("section");
const navigationLinks =
    document.querySelectorAll(".nav-links a");


window.addEventListener("scroll", function () {

    let currentSection = "";


    sections.forEach(function (section) {

        const sectionTop =
            section.offsetTop - 150;

        const sectionHeight =
            section.offsetHeight;


        if (
            window.scrollY >= sectionTop &&
            window.scrollY < sectionTop + sectionHeight
        ) {

            currentSection =
                section.getAttribute("id");

        }

    });


    navigationLinks.forEach(function (link) {

        link.classList.remove("active");


        if (
            link.getAttribute("href") ===
            "#" + currentSection
        ) {

            link.classList.add("active");

        }

    });

});


/* =========================================================
   SCROLL REVEAL ANIMATION
========================================================= */

const revealElements =
    document.querySelectorAll(".reveal");


const revealObserver =
    new IntersectionObserver(

        function (entries, observer) {

            entries.forEach(function (entry) {

                if (entry.isIntersecting) {

                    entry.target.classList.add("visible");

                    observer.unobserve(entry.target);

                }

            });

        },

        {
            threshold: 0.12
        }

    );


revealElements.forEach(function (element) {

    revealObserver.observe(element);

});


/* =========================================================
   TOAST FUNCTION
========================================================= */

const toast =
    document.getElementById("toast");


function showToast(message) {

    toast.textContent = message;

    toast.classList.add("show");


    setTimeout(function () {

        toast.classList.remove("show");

    }, 3000);

}


/* =========================================================
   CONTACT FORM
   Opens visitor's email application using mailto.
========================================================= */

const contactForm =
    document.getElementById("contactForm");


contactForm.addEventListener(
    "submit",
    function (event) {

        event.preventDefault();


        const name =
            document.getElementById("name")
                .value
                .trim();


        const email =
            document.getElementById("email")
                .value
                .trim();


        const subject =
            document.getElementById("subject")
                .value
                .trim();


        const message =
            document.getElementById("message")
                .value
                .trim();


        /* Validate fields */

        if (
            !name ||
            !email ||
            !subject ||
            !message
        ) {

            showToast(
                "Please complete all fields."
            );

            return;

        }


        /* Recipient email */

        const recipient =
            "aljansurot375@gmail.com";


        /* Encode email information */

        const emailSubject =
            encodeURIComponent(subject);


        const emailBody =
            encodeURIComponent(

                "Name: " + name +
                "\n" +
                "Email: " + email +
                "\n\n" +
                message

            );


        /* Create mailto link */

        const mailtoLink =
            "mailto:" +
            recipient +
            "?subject=" +
            emailSubject +
            "&body=" +
            emailBody;


        /* Open email application */

        window.location.href =
            mailtoLink;


        showToast(
            "Opening your email application..."
        );


        /* Reset form */

        contactForm.reset();

    }
);
